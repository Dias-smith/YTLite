<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mixtube · Google Drive</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #111;
        color: #eee;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #8ab4f8;
      }
    </style>
    <script>
      (function () {
        // Google OAuth (Web client) cannot redirect to custom schemes.
        // Bridge HTTPS → ytlite:// so ASWebAuthenticationSession can complete.
        var q = window.location.search || "";
        var deep = "ytlite://gdrive-picker" + q;
        window.location.replace(deep);
        setTimeout(function () {
          var el = document.getElementById("hint");
          if (el) el.hidden = false;
        }, 1200);
      })();
    </script>
  </head>
  <body>
    <div>
      <p>Returning to Mixtube…</p>
      <p id="hint" hidden>
        If the app did not open,
        <a id="open" href="#">tap here</a>.
      </p>
    </div>
    <script>
      document.getElementById("open").href =
        "ytlite://gdrive-picker" + (window.location.search || "");
    </script>
  </body>
</html>
