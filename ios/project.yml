name: YTLite
options:
  bundleIdPrefix: com.ytlite
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Must match across app + Watch + Widget or App Store returns “Invalid Binary”.
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "5"
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.6.0
  google-mobile-ads:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
targets:
  YTLite:
    type: application
    platform: iOS
    sources:
      - path: YTLite
      - path: YTLiteWatchConnectivity
      - path: YTLiteWidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytlite.player
        PRODUCT_NAME: Mixtube
        INFOPLIST_FILE: YTLite/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: YTLite/YTLite.entitlements
        DEVELOPMENT_TEAM: "8S748AQ4H7"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        VALIDATE_PRODUCT: NO
        DEVELOPMENT_LANGUAGE: en
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: YTLite/YTLite.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.ytlite.player
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: supabase-swift
        product: Supabase
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
      - package: firebase-ios-sdk
        product: FirebaseCrashlytics
      - package: firebase-ios-sdk
        product: FirebaseRemoteConfig
      - package: google-mobile-ads
        product: GoogleMobileAds
      # Embed & Sign into Watch/ — App Store rejects Watch apps under PlugIns (ITMS-90680).
      - target: YTLite Watch App
        embed: true
        codeSign: true
      - target: YTLite Widget
        embed: true
        codeSign: true
      - sdk: WidgetKit.framework
      # AudioPlaybackIntent for Home Screen widget controls (runs in app process).
      - sdk: AppIntents.framework
    # Xcode 26 local device install sometimes looks under PlugIns/; App Store requires Watch/.
    # Debug: also mirror into PlugIns for local companion discovery.
    # Release/Archive: ensure only Watch/ remains (no PlugIns copy, no symlink).
    postbuildScripts:
      - name: Place Watch companion for store and device
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_ROOT="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          WATCH_DIR="${APP_ROOT}/Watch"
          WATCH_APP="${WATCH_DIR}/MixtubeWatch.app"
          PLUGINS_DIR="${APP_ROOT}/PlugIns"
          PLUGINS_APP="${PLUGINS_DIR}/MixtubeWatch.app"

          # Prefer whatever the Embed phase produced.
          SRC=""
          if [ -d "$WATCH_APP" ] && [ ! -L "$WATCH_APP" ]; then
            SRC="$WATCH_APP"
          elif [ -d "$PLUGINS_APP" ] && [ ! -L "$PLUGINS_APP" ]; then
            SRC="$PLUGINS_APP"
          fi
          if [ -z "$SRC" ]; then
            echo "[YTLite] ERROR: MixtubeWatch.app missing under Watch/ or PlugIns/"
            exit 1
          fi

          mkdir -p "$WATCH_DIR"
          if [ "$SRC" != "$WATCH_APP" ]; then
            rm -rf "$WATCH_APP"
            ditto "$SRC" "$WATCH_APP"
            echo "[YTLite] Copied companion to Watch/MixtubeWatch.app"
          fi

          # App Store (Release/Archive): Watch apps must not live under PlugIns/.
          if [ "${CONFIGURATION}" = "Release" ] || [ "${ACTION:-}" = "install" ]; then
            if [ -e "$PLUGINS_APP" ]; then
              rm -rf "$PLUGINS_APP"
              echo "[YTLite] Removed PlugIns/MixtubeWatch.app for App Store packaging"
            fi
            # Drop empty PlugIns dir if we emptied it.
            if [ -d "$PLUGINS_DIR" ] && [ -z "$(ls -A "$PLUGINS_DIR" 2>/dev/null || true)" ]; then
              rmdir "$PLUGINS_DIR" 2>/dev/null || true
            fi
          else
            # Debug: always refresh PlugIns copy for Xcode 26 local install paths.
            # Stale copies (old CFBundleVersion) cause intermittent Watch install failures.
            mkdir -p "$PLUGINS_DIR"
            rm -rf "$PLUGINS_APP"
            ditto "$WATCH_APP" "$PLUGINS_APP"
            echo "[YTLite] Mirrored companion to PlugIns/MixtubeWatch.app (Debug)"
          fi

          # Strip iOS-only keys that leak into the embedded companion Info.plist.
          # Only rewrite when a key actually exists, then re-sign — mutating a signed
          # Info.plist breaks phone→Watch companion install (codesign verify fails).
          resign_needed=0
          for PLIST in \
            "$WATCH_APP/Info.plist" \
            "$PLUGINS_APP/Info.plist"
          do
            if [ -f "$PLIST" ]; then
              if /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion~ipad" "$PLIST" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion~ipad" "$PLIST"
                resign_needed=1
              fi
              if /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST"
                resign_needed=1
              fi
            fi
          done

          # Drop debug/preview dylibs from the embedded companion — watchOS rejects them
          # during integrity check when installing from the iPhone Watch app.
          # POSIX-only (Xcode runs this with /bin/sh).
          for ROOT in "$WATCH_APP" "$PLUGINS_APP"; do
            [ -d "$ROOT" ] || continue
            FOUND=$(find "$ROOT" \( -name '*.debug.dylib' -o -name '__preview.dylib' \) -type f -print 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              echo "$FOUND" | while IFS= read -r DYLIB; do
                [ -n "$DYLIB" ] || continue
                echo "[YTLite] Removed $(basename "$DYLIB") from embedded Watch package"
              done
              find "$ROOT" \( -name '*.debug.dylib' -o -name '__preview.dylib' \) -type f -delete 2>/dev/null || true
              resign_needed=1
            fi
          done

          if [ "$resign_needed" = "1" ]; then
            IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
            if [ -z "$IDENTITY" ] || [ "$IDENTITY" = "-" ]; then
              IDENTITY="${CODE_SIGN_IDENTITY:-}"
            fi
            if [ -n "$IDENTITY" ] && [ "$IDENTITY" != "-" ]; then
              for BUNDLE in "$WATCH_APP" "$PLUGINS_APP"; do
                [ -d "$BUNDLE" ] || continue
                if [ -d "$BUNDLE/PlugIns/MixtubeWatchWidget.appex" ]; then
                  codesign --force --sign "$IDENTITY" --timestamp=none \
                    --generate-entitlement-der \
                    "$BUNDLE/PlugIns/MixtubeWatchWidget.appex"
                fi
                codesign --force --sign "$IDENTITY" --timestamp=none \
                  --generate-entitlement-der \
                  --preserve-metadata=identifier,entitlements,flags \
                  "$BUNDLE"
                echo "[YTLite] Re-signed $(basename "$BUNDLE") after packaging fixes"
              done
            else
              echo "[YTLite] WARNING: no code-sign identity; Watch package may fail install"
            fi
          fi

  YTLite Watch App:
    type: application
    platform: watchOS
    sources:
      - path: YTLiteWatch
      - path: YTLiteWatchConnectivity
      - path: YTLiteWatchWidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytlite.player.watchkitapp
        # Must be a strict prefix child of com.ytlite.player.
        PRODUCT_NAME: MixtubeWatch
        PRODUCT_MODULE_NAME: YTLiteWatch
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: YTLiteWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mixtube
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ytlite.player
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
        CODE_SIGN_ENTITLEMENTS: YTLiteWatch/YTLiteWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "8S748AQ4H7"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # Companion packaging: install via iPhone embed, not as a top-level phone product.
        SKIP_INSTALL: true
        # Xcode 15+ debug/preview dylibs fail watchOS integrity checks on phone→Watch install.
        ENABLE_DEBUG_DYLIB: false
        ENABLE_PREVIEWS: false
    # Project-level IPHONEOS_DEPLOYMENT_TARGET can leak MinimumOSVersion~ipad into the Watch
    # Info.plist and confuse companion discovery on iPhone.
    postCompileScripts:
      - name: Strip iOS Info.plist leaks from Watch
        basedOnDependencyAnalysis: false
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion~ipad" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          fi
    entitlements:
      path: YTLiteWatch/YTLiteWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ytlite.player
    dependencies:
      - target: YTLite Watch Widget
        embed: true
        codeSign: true
      - sdk: WidgetKit.framework

  YTLite Watch Widget:
    type: app-extension
    platform: watchOS
    sources:
      - path: YTLiteWatchWidget
      - path: YTLiteWatchWidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytlite.player.watchkitapp.widget
        PRODUCT_NAME: MixtubeWatchWidget
        PRODUCT_MODULE_NAME: YTLiteWatchWidget
        INFOPLIST_FILE: YTLiteWatchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: YTLiteWatchWidget/YTLiteWatchWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "8S748AQ4H7"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SUPPORTS_MACCATALYST: false
        SKIP_INSTALL: true
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_DEBUG_DYLIB: false
        ENABLE_PREVIEWS: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: YTLiteWatchWidget/YTLiteWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ytlite.player
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  YTLite Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: YTLiteWidget
      - path: YTLiteWidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytlite.player.widget
        PRODUCT_NAME: MixtubeWidget
        PRODUCT_MODULE_NAME: YTLiteWidget
        INFOPLIST_FILE: YTLiteWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: YTLiteWidget/YTLiteWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "8S748AQ4H7"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: YTLiteWidget/YTLiteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ytlite.player
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

schemes:
  YTLite:
    build:
      targets:
        YTLite: all
        YTLite Widget: [build]
        YTLite Watch App: [build]
        YTLite Watch Widget: [build]
    run:
      config: Debug
      # Keep phone as the runnable; Watch embeds via the iOS target dependency.
      executable: YTLite
  YTLite Watch App:
    build:
      targets:
        YTLite Watch App: all
        YTLite Watch Widget: [build]
    run:
      config: Debug
      executable: YTLite Watch App
